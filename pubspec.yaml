name: app_template
description: "Flutter app template — Riverpod + GoRouter + Dio + Freezed + L10n + Sentry + PostHog."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.2.1

  # Networking
  dio: ^5.9.1
  retrofit: ^4.9.2
  dio_cache_interceptor: ^4.0.5

  # Models & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0

  # Error Handling
  fpdart: ^1.2.0

  # Navigation
  go_router: ^17.1.0

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4

  # Analytics & Monitoring
  posthog_flutter: ^5.15.0
  sentry_flutter: ^9.13.0
  sentry_dio: ^9.13.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.2.3
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  flutter_markdown: ^0.7.7

  # Forms
  reactive_forms: ^18.2.2

  # Environment
  envied: ^1.3.3

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2
  connectivity_plus: ^7.0.0
  logger: ^2.6.2
  cupertino_icons: ^1.0.8
  flutter_form_builder: ^10.3.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.12.0
  retrofit_generator: ^10.2.3
  envied_generator: ^1.3.3

  # Testing
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
