name: fluffle
description: "Production-ready Flutter starter template: Riverpod, GoRouter, Dio, Material 3 (material_ui), flavors, en + fa (RTL)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  material_ui: ^1.4.0
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  generate: true
  # Plain `flutter run` uses the dev flavor. Pass --flavor to override.
  default-flavor: dev
